<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Poietra — Glow preview</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; padding: 28px; background: #181920; color: #dadbe5; font: 14px system-ui, sans-serif; }
      header, .toolbar, .transport { display: flex; align-items: center; gap: 12px; }
      header { justify-content: space-between; border-bottom: 1px solid #30313e; padding-bottom: 20px; }
      h1 { margin: 0 0 8px; font-size: 21px; font-weight: 550; }
      p, output { margin: 0; color: #999bab; }
      button, select { background: #262733; color: #dadbe5; border: 1px solid #393b4b; border-radius: 5px; padding: 8px 13px; font: inherit; }
      button:hover { background: #303241; }
      button:disabled { opacity: .45; }
      button:focus-visible, input:focus-visible { outline: 2px solid #9093c9; outline-offset: 2px; }
      .panes { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin: 24px 0; }
      h2 { font-size: 13px; font-weight: 500; color: #b6b8c8; margin: 0 0 12px; }
      canvas { display: block; width: 100%; height: auto; aspect-ratio: 16 / 9; background: #08090b; }
      .transport { border: 1px solid #30313e; border-radius: 6px; padding: 14px; }
      input[type=range] { flex: 1; accent-color: #9395bc; }
      .toolbar label { display: flex; align-items: center; gap: 7px; }
      #status { margin-top: 18px; min-height: 44px; white-space: pre-line; line-height: 1.6; }
      #measurements { margin-top: 12px; color: #999bab; font-size: 12px; white-space: pre-wrap; }
      @media (max-width: 800px) { header { display: block; } .toolbar { margin-top: 18px; flex-wrap: wrap; } .panes { grid-template-columns: 1fr; } }
    </style>
  </head>
  <body>
    <header>
      <div><h1>Poietra · Glow</h1><p id="scene-details">描画を準備しています</p></div>
      <div class="toolbar">
        <label><input id="glow" type="checkbox" checked /> Glow</label>
        <button id="save-mp4" type="button">MP4 保存</button>
        <button id="save-webm" type="button">WebM 保存</button>
        <button id="cancel" type="button" disabled>書き出しを中断</button>
      </div>
    </header>
    <main>
      <div class="panes">
        <section><h2>Canvas プレビュー · <span id="backend">準備中</span></h2><canvas id="preview" width="1280" height="720"></canvas></section>
        <section><h2>保存した動画の同時刻フレーム</h2><canvas id="decoded" width="1280" height="720"></canvas></section>
      </div>
      <div class="transport">
        <button id="play" type="button">再生</button>
        <input id="seek" aria-label="再生位置（秒）" type="range" min="0" value="0" step="0.001" />
        <output id="time" for="seek">0.000 s</output>
      </div>
      <p id="status" role="status">数式とローカルフォントを読み込んでいます。</p>
      <pre id="measurements"></pre>
    </main>
    <script type="module" src="./effects.ts"></script>
  </body>
</html>
